<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — Mutuelle santé</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#111827; }
  .card { background:#fff; border-radius:12px; padding:32px 30px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  h1 { font-size:18px; margin: 0 0 4px; color:#111827; }
  p.sub { font-size:13px; color:#6b7280; margin:0 0 22px; }
  label { display:block; font-size:13px; color:#374151; margin-bottom:6px; font-weight:600; }
  input { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; margin-bottom:16px; }
  input:focus { outline: 2px solid #2563eb; border-color: transparent; }
  button { width:100%; padding:10px; border:none; border-radius:8px; background:#2563eb; color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  .errorlist { color:#dc2626; font-size:12.5px; list-style:none; padding:0; margin:-8px 0 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>🛡️ Mutuelle santé</h1>
  <p class="sub">Outil de contrôle de la fraude — connexion</p>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<ul class="errorlist"><li>Matricule ou mot de passe incorrect.</li></ul>{% endif %}
    <label for="id_username">Matricule</label>
    {{ form.username }}
    <label for="id_password">Mot de passe</label>
    {{ form.password }}
    <button type="submit">Se connecter</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
</body>
</html>
